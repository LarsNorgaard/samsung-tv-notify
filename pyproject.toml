[project]
name = "samsung-tv-notify-dev"
version = "0.0.0"
requires-python = ">=3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "ASYNC"]
ignore = ["E501"]
